# Glasses beta dependency graph. Omitted entirely from phone-only archives.
packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios.git
    # Pinned exact, not `from:`. Through 0.x this SDK broke API on every minor bump (0.9.0
    # replaced `addStream` with `addCamera`, 0.8.0 removed `Capability`, 0.7.0 removed
    # `DeviceStateSession`), and 1.0.0 still renamed `StreamError` cases, removed
    # `Wearables.deviceStateStream` and — unannounced — `RegistrationError.timeout`. 1.x is
    # semver, but only for the stable surface: Meta ships [Experimental] modules and APIs (Inputs,
    # Motion, Speech, voice invocations, `Camera.photo`, camera audio) that may change in any minor
    # and that published apps may not use. We link none of them; staying exact means a 1.y is read
    # and adopted deliberately, never picked up by a resolve.
    version: "1.0.1"

targets:
  OpenGlasses:
    entitlements:
      path: .generated/OpenGlasses.glasses.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        MWDAT_META_APP_ID: YOUR_META_APP_ID
        MWDAT_CLIENT_TOKEN_HASH: YOUR_CLIENT_TOKEN_HASH
        AVENKIN_BUILD_VARIANT: glasses-beta
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
      - package: meta-wearables-dat-ios
        product: MWDATDisplay
