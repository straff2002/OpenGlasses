name: Deploy to GitHub Pages

# Publishes the *staged* site, not the checkout.
#
# This used to upload `path: .` — every tracked file in the repository. Nothing had leaked, but
# what reached the public artifact was decided by `.gitignore` rather than by anyone's judgement:
# compliance evidence under plans/, signing overlays under Config/, and the whole source tree were
# all one `git add` away from being published with no diff to review.
#
# Scripts/stage-pages-site.sh copies an explicit allowlist into _site/ and then, independently,
# refuses to hand over a staged tree containing a denied path. It fails the job rather than
# publishing, so an over-broad allowlist stops the deploy instead of shipping.

#
# Scripts/check-pages-site.py then checks what the staged site promises (Plan FZ): the legacy paths
# shipped builds read are all present, no page loads anything from another site, every internal
# link resolves, and the Meta sign-in hand-off still builds the link the app expects. Pull requests
# that touch the site run the same staging and checks without deploying.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - '*.html'
      - '.well-known/**'
      - 'Scripts/stage-pages-site.sh'
      - 'Scripts/check-pages-site.py'
      - 'Scripts/site-legacy-paths.txt'
      - 'Scripts/tests/site-auth-forward.test.js'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stage the allowlisted site
        run: ./Scripts/stage-pages-site.sh
      - name: Check the staged site
        run: |
          python3 Scripts/check-pages-site.py _site
          node Scripts/tests/site-auth-forward.test.js

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stage the allowlisted site
        run: ./Scripts/stage-pages-site.sh
      - name: Check the staged site
        run: |
          python3 Scripts/check-pages-site.py _site
          node Scripts/tests/site-auth-forward.test.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
