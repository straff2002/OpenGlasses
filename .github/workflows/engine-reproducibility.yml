# The llama.cpp engine is committed, so no ordinary run rebuilds it. This does: it compiles the
# pinned revision from scratch and requires the result to be byte-identical to what is in the tree.
#
# That is the claim committing a binary otherwise costs you. A blob in a repository says nothing
# about where it came from; this says the committed bytes are the ones Vendor/LlamaCpp/REVISION
# produces, and says it on a schedule rather than on the honour system.
#
# --strict means any difference fails, including one the toolchain explains. That is deliberate
# here: if a runner's Xcode moves and the engine no longer reproduces, the honest outcome is a red
# job and a decision — re-record the bytes deliberately, or pin the toolchain — not a note in a
# log nobody reads.
name: Engine Reproducibility

on:
  schedule:
    - cron: '0 4 * * 1'          # Mondays, 04:00 UTC
  workflow_dispatch:
    inputs:
      record:
        description: 'Record this runner''s build (--update-sums) and upload it, instead of comparing'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'Vendor/LlamaCpp/REVISION'
      - 'Vendor/LlamaCpp/SHA256SUMS'
      - 'Vendor/LlamaCpp/BUILD-INFO'
      - 'Vendor/LlamaCpp/chat/CMakeLists.txt'
      - 'Scripts/build-llamacpp-framework.sh'
      - 'Scripts/fetch-llamacpp-framework.sh'
      - '.github/workflows/engine-reproducibility.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN permission set is whatever the repository's default happens to be, which
# changes under you when an org setting moves. Declare it: nothing in this workflow writes to the
# repository. Uploading an artifact is an artifact-scope operation and does not need `contents:
# write` — a token that can push is a token a compromised action can push with.
permissions:
  contents: read

jobs:
  rebuild:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The bytes depend on the toolchain, and BUILD-INFO names the one that produced them. Use it
      # when the runner has it; when it does not, say so — the --strict rebuild below still fails
      # on the difference, which is the decision this workflow exists to force.
      - name: Use the Xcode the record names
        run: |
          want="$(sed -n 's/^xcodebuild=Xcode \([0-9.]*\) .*/\1/p' Vendor/LlamaCpp/BUILD-INFO)"
          app="/Applications/Xcode_${want}.app"
          if [ -n "$want" ] && [ -d "$app" ]; then
            sudo xcode-select -s "$app"
          else
            echo "::warning::Xcode ${want:-?} (named in BUILD-INFO) is not on this runner"
            ls -d /Applications/Xcode*.app || true
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version || true
          echo "recorded:"; cat Vendor/LlamaCpp/BUILD-INFO

      - name: Rebuild the pinned engine and require identical bytes
        if: ${{ !inputs.record }}
        run: ./Scripts/build-llamacpp-framework.sh --clean --strict

      # --strict already fails on any difference; this catches the other half — a build that
      # somehow edited what is committed instead of comparing itself to it.
      - name: The rebuild changed nothing in the tree
        if: ${{ !inputs.record }}
        run: git diff --exit-code Vendor/LlamaCpp

      # The deliberate re-record: a run started by hand with `record` builds on this runner's
      # toolchain, records its digests and uploads engine, SHA256SUMS and BUILD-INFO for a person
      # to commit. The next ordinary run then checks those bytes against the same toolchain. It
      # writes nothing to the repository itself.
      - name: Record this runner's build
        if: ${{ inputs.record }}
        run: ./Scripts/build-llamacpp-framework.sh --clean --update-sums

      - name: Upload the recorded engine
        if: ${{ inputs.record }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llama-engine-record
          path: |
            Vendor/LlamaCpp/Frameworks/llama.xcframework
            Vendor/LlamaCpp/SHA256SUMS
            Vendor/LlamaCpp/BUILD-INFO
          if-no-files-found: error
          retention-days: 7
