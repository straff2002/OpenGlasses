name: Accessibility Audit

# Runs OpenGlassesUITests — the accessibility regression gate (Plan DF P4).
#
# Force-added past the `.github/` gitignore, same as tests.yml: the ignore keeps *personal*
# workflows local, but a gate has to travel with the repo.
#
# Why this is not part of tests.yml
# --------------------------------
# The unit workflow is the per-PR gate and is kept cheap on purpose. This one is not cheap: a UI
# test launches the app into a simulator once per case and walks it, and the audit itself has to
# render every screen before it can measure contrast and hit regions. Measured against an iOS 27
# simulator, the fifteen cases take about 13 minutes of test time (~16½ wall with an incremental
# build) — well past the point where adding it to every PR would multiply the cost of the tracked
# gate for a class of failure that changes far less often than app code does.
#
# So: nightly, plus a manual dispatch, plus a label. Label it `accessibility` on a PR that touches
# the accessibility surface and the audit runs against that PR before it merges.
#
# The runner notes from tests.yml all apply here (macos-26 for the SDK, XcodeGen pinned and
# checksum-verified,
# MediaPipe fetched and cached, SPM checkouts cached, watch targets skipped,
# SWIFT_EMIT_LOC_STRINGS=NO so the tracked string catalog cannot churn).

on:
  workflow_dispatch:
  schedule:
    # 14:00 UTC — early evening in NZ, so a failure is waiting at the start of the next day here.
    - cron: '0 14 * * *'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN permission set is whatever the repository's default happens to be, which
# changes under you when an org setting moves. Declare it: nothing in this workflow writes to the
# repository. Uploading an artifact is an artifact-scope operation and does not need `contents:
# write` — a token that can push is a token a compromised action can push with.
permissions:
  contents: read

jobs:
  audit:
    # On a PR this runs only when the `accessibility` label is on it. Deliberately a label test
    # rather than a paths filter: `paths-ignore` negation re-*includes* rather than excludes, and
    # the surface this gate covers is most of the app's view layer — a path list broad enough to
    # be correct would fire on nearly every PR anyway.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'accessibility')
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      # brew installs whatever version the tap holds that morning and verifies nothing this
      # repository states. XcodeGen writes the project file every build compiles, so the pinned,
      # sha256-verified install is the same standard the vendored binaries already meet. The
      # script appends its bin directory to $GITHUB_PATH, so later steps just find it.
      - name: Install XcodeGen (pinned, checksum-verified)
        run: ./Scripts/install-xcodegen.sh

      - name: Cache MediaPipe frameworks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/MediaPipeTasks/Frameworks
          key: mediapipe-frameworks-${{ hashFiles('Scripts/fetch-mediapipe-frameworks.sh') }}

      - name: Fetch MediaPipe frameworks
        run: ./Scripts/fetch-mediapipe-frameworks.sh

      # The llama.cpp engine (Plan DZ) is fetched or built, not committed — the XCFramework is
      # ~50 MB and SPM refuses to resolve a local binary target whose directory is empty, so this
      # must run before any package resolution. Cached on the pinned revision: the cache misses
      # only when REVISION moves, and a miss costs one from-source build rather than one per run.
      - name: Cache llama.cpp framework
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/LlamaCpp/Frameworks
          key: llamacpp-framework-${{ hashFiles('Vendor/LlamaCpp/REVISION', 'Scripts/build-llamacpp-framework.sh') }}

      - name: Fetch llama.cpp framework
        run: ./Scripts/fetch-llamacpp-framework.sh

      - name: Cache SPM checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm-checkouts
          key: spm-${{ runner.os }}-${{ hashFiles('project.base.yml', 'ci_scripts/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Skip Watch targets
        run: printf 'OPENGLASSES_SKIP_WATCH=1\n' > .openglasses-generate.env

      - name: Generate Xcode project
        run: ./Scripts/generate-xcodeproj.sh

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          phones = [d for devs in data.values() for d in devs if "iPhone" in d["name"]]
          if not phones:
              sys.exit("no available iPhone simulator on this image")
          print(phones[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Run accessibility audits
        run: |
          set -o pipefail
          xcodebuild test \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlassesUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath AccessibilityResults.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath .spm-checkouts \
            SWIFT_EMIT_LOC_STRINGS=NO \
            2>&1 | tee xcodebuild.log \
            | grep -E "Test Suite|Test Case.*(passed|failed)|a11y-audit|error:|\*\* TEST" \
            || { tail -200 xcodebuild.log; exit 1; }

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AccessibilityResults
          path: AccessibilityResults.xcresult
          retention-days: 7
