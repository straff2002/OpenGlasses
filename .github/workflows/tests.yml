name: Unit Tests

# Runs OpenGlassesTests on every PR — the tracked test gate (Plan CD P1).
#
# This file is force-added past the `.github/` gitignore (same as pages.yml): the ignore exists to
# keep *personal* workflows local, but the test gate has to travel with the repo. It exists because
# the launch/Connect crash fixed in Plan CD was reachable for months while 224 test files never ran
# in any tracked CI — Xcode Cloud's workflow config lives in App Store Connect where the repo
# can't see or version it.
#
# Runner notes (proven against this codebase on GitHub-hosted runners):
# - macos-26 for the iOS 26 SDK; macos-15's Xcode is too old for HaishinKit/the deployment target.
# - brew install xcodegen works on GitHub Actions (the ghcr.io resolution failure is Xcode Cloud
#   only — see ci_scripts/ci_post_clone.sh, which installs from a GitHub release instead).
# - Watch targets are skipped: the watchOS platform isn't needed to run the iOS unit tests and
#   slows the build.
# - SWIFT_EMIT_LOC_STRINGS=NO so the build can't churn the tracked Localizable.xcstrings.
# - No CODE_SIGNING_ALLOWED=NO: simulator Debug builds sign to run locally without an identity,
#   and disabling signing outright is known to fail ~10 keychain-backed tests spuriously.

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# A PR run is obsolete the moment a newer commit lands on the same branch, but without a
# concurrency group the superseded run still bills a full ~17-minute macOS slot. Twelve August
# runs (227 macOS minutes) were already stale when they finished; one branch queued eleven.
#
# main is deliberately exempt: `cancel-in-progress` is false for push events, because a run on
# main is the record of what main does and must not be cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      # The MediaPipe binaries (Plan CK) are fetched, not committed — the graph static
      # libraries exceed GitHub's per-file size limit. Cached so the ~440 MB download
      # doesn't repeat every run; the fetch script is idempotent on a cache hit.
      - name: Cache MediaPipe frameworks
        uses: actions/cache@v6
        with:
          path: Vendor/MediaPipeTasks/Frameworks
          key: mediapipe-frameworks-${{ hashFiles('Scripts/fetch-mediapipe-frameworks.sh') }}

      - name: Fetch MediaPipe frameworks
        run: ./Scripts/fetch-mediapipe-frameworks.sh

      # The llama.cpp engine (Plan DZ) is fetched or built, not committed — the XCFramework is
      # ~50 MB and SPM refuses to resolve a local binary target whose directory is empty, so this
      # must run before any package resolution. Cached on the pinned revision: the cache misses
      # only when REVISION moves, and a miss costs one from-source build rather than one per run.
      - name: Cache llama.cpp framework
        uses: actions/cache@v6
        with:
          path: Vendor/LlamaCpp/Frameworks
          key: llamacpp-framework-${{ hashFiles('Vendor/LlamaCpp/REVISION', 'Scripts/build-llamacpp-framework.sh') }}

      - name: Fetch llama.cpp framework
        run: ./Scripts/fetch-llamacpp-framework.sh

      # Obtaining the engine must not edit what is committed about it. It used to: an explained
      # digest difference rewrote SHA256SUMS in the workspace, so the test comparing the two was
      # comparing the build to itself. This fails the run if that ever comes back.
      - name: Vendor digests survive the build
        run: git diff --exit-code Vendor/LlamaCpp

      # Every run re-clones the full SPM graph — WebRTC, HaishinKit, mlx-swift-lm and the
      # HuggingFace packages — before a line of app code compiles. The checkouts are identical
      # between runs unless the pins move, so -clonedSourcePackagesDirPath (set on the xcodebuild
      # invocation below) puts them at a stable path this can cache.
      #
      # DerivedData is deliberately NOT cached. A restored build directory carries absolute paths
      # and module timestamps from another machine, and this repo has already lost time to
      # stale-artefact failures that look like source bugs. Caching the inputs is safe; caching
      # the outputs is not.
      - name: Cache SPM checkouts
        uses: actions/cache@v6
        with:
          path: .spm-checkouts
          key: spm-${{ runner.os }}-${{ hashFiles('project.base.yml', 'ci_scripts/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Skip Watch targets
        run: printf 'OPENGLASSES_SKIP_WATCH=1\n' > .openglasses-generate.env

      - name: Generate Xcode project
        run: ./Scripts/generate-xcodeproj.sh

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          phones = [d for devs in data.values() for d in devs if "iPhone" in d["name"]]
          if not phones:
              sys.exit("no available iPhone simulator on this image")
          print(phones[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      - name: Run unit tests
        # Below the job's 90-minute cap so a hung run fails while there is still budget to
        # report it. Healthy runs have measured 16-24 minutes, so this is about twice the
        # slowest of them: a run past it has hung, and both hangs so far ran to the cap.
        timeout-minutes: 50
        run: |
          set -o pipefail
          # -skipPackagePluginValidation/-skipMacroValidation: a fresh runner has trusted no
          # plugins, so without them the run dies on 'Plugin "CudaBuild" from package "mlx-swift"
          # must be enabled before it can be used' before any test executes.
          # 2>&1: xcodebuild reports its errors on stderr — without merging, the failure tail
          # below shows package resolution instead of the actual cause.
          # -test-timeouts-enabled: a single wedged test fails itself, by name, instead of
          # stalling the whole run behind it. No test here runs anywhere near 120s.
          # grep --line-buffered: without it the log streams a 4KB block at a time, so when a
          # run does stall the last visible line is minutes behind where it stopped.
          xcodebuild test \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlasses \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath .spm-checkouts \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            SWIFT_EMIT_LOC_STRINGS=NO \
            2>&1 | tee xcodebuild.log | grep --line-buffered -E "Test Suite|Test Case.*(passed|failed)|error:|\*\* TEST" \
            || { tail -100 xcodebuild.log; exit 1; }

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
