name: Unit Tests

# Runs OpenGlassesTests on every PR — the tracked test gate (Plan CD P1) — plus a narrower
# security-regression suite on PRs that touch the security surface.
#
# This file is force-added past the `.github/` gitignore (same as pages.yml): the ignore exists to
# keep *personal* workflows local, but the test gate has to travel with the repo. It exists because
# the launch/Connect crash fixed in Plan CD was reachable for months while 224 test files never ran
# in any tracked CI — Xcode Cloud's workflow config lives in App Store Connect where the repo
# can't see or version it.
#
# The twelve steps that turn a checkout into a generated project and a booted simulator live in
# .github/actions/xcode-project, so the two macOS jobs below cannot drift apart in how they build
# the thing they test.
#
# Runner notes (proven against this codebase on GitHub-hosted runners):
# - macos-26 for the iOS 26 SDK; macos-15's Xcode is too old for HaishinKit/the deployment target.
# - XcodeGen is installed from the pinned, sha256-verified GitHub release (Scripts/install-xcodegen.sh
#   + Scripts/xcodegen-pin.env), not from brew — the same tool Xcode Cloud installs, which is the
#   point. brew would work here (the ghcr.io resolution failure is Xcode Cloud only) but it
#   installs an unpinned, unverified version.
# - Watch targets are skipped: the watchOS platform isn't needed to run the iOS unit tests and
#   slows the build.
# - SWIFT_EMIT_LOC_STRINGS=NO so the build can't churn the tracked Localizable.xcstrings.
# - No CODE_SIGNING_ALLOWED=NO: simulator Debug builds sign to run locally without an identity,
#   and disabling signing outright is known to fail ~10 keychain-backed tests spuriously.

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# A PR run is obsolete the moment a newer commit lands on the same branch, but without a
# concurrency group the superseded run still bills a full ~17-minute macOS slot. Twelve August
# runs (227 macOS minutes) were already stale when they finished; one branch queued eleven.
#
# main is deliberately exempt: `cancel-in-progress` is false for push events, because a run on
# main is the record of what main does and must not be cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN permission set is whatever the repository's default happens to be, which
# changes under you when an org setting moves. Declare it: nothing in this workflow writes to the
# repository. Uploading an artifact is an artifact-scope operation and does not need `contents:
# write` — a token that can push is a token a compromised action can push with.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Blocking, and first, because it needs no toolchain: a direct NSLog/print in production
      # sources, a log line interpolating a credential- or content-named value, or an
      # unexplained allowlist entry should cost twenty seconds of Linux-free macOS time, not a
      # twenty-minute build. The structural half of this gate is PrivacyLogTests in the suite
      # below; this is the global backstop every new file inherits without anyone remembering.
      - name: Privacy-logging gate
        run: ./Scripts/check-privacy-logging.sh

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Prepare the Xcode project
        id: project
        uses: ./.github/actions/xcode-project

      # What this run actually used, written down. A green test run only means something if you
      # can say later which toolchain, SDK, dependency graph and vendored binaries produced it —
      # and "the runner image at the time" is not an answer once the image has rolled.
      - name: Record build provenance
        run: |
          {
            echo "commit:   ${{ github.sha }}"
            echo "workflow: ${{ github.workflow }} run ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "runner:   ${{ runner.os }} ${{ runner.arch }} (${{ runner.name }})"
            echo
            echo "-- os --"
            sw_vers
            echo
            echo "-- xcode --"
            xcodebuild -version
            echo "iphonesimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
            echo "iphoneos SDK:        $(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo 'not installed')"
            echo "swift: $(swift --version 2>&1 | head -n 1)"
            echo
            echo "-- build tools --"
            echo "xcodegen: $(xcodegen --version 2>&1 | head -n 1)"
            shasum -a 256 Scripts/xcodegen-pin.env
            echo
            echo "-- dependency graph --"
            shasum -a 256 ci_scripts/Package.resolved
            echo "pins: $(grep -c '\"identity\"' ci_scripts/Package.resolved)"
            echo
            echo "-- vendored binaries --"
            for sums in Vendor/*/SHA256SUMS; do
              [ -e "$sums" ] || continue
              shasum -a 256 "$sums"
              echo "  entries: $(wc -l < "$sums" | tr -d ' ')"
            done
            for rev in Vendor/*/REVISION; do
              [ -e "$rev" ] || continue
              echo "$rev:"
              grep -E '^(repository|tag|commit)=' "$rev" | sed 's/^/  /'
            done
          } | tee provenance.txt

      - name: Run unit tests
        # Below the job's 90-minute cap so a hung run fails while there is still budget to
        # report it. Healthy runs have measured 16-24 minutes, so this is about twice the
        # slowest of them: a run past it has hung, and both hangs so far ran to the cap.
        timeout-minutes: 50
        run: |
          set -o pipefail
          # -skipPackagePluginValidation/-skipMacroValidation: a fresh runner has trusted no
          # plugins, so without them the run dies on 'Plugin "CudaBuild" from package "mlx-swift"
          # must be enabled before it can be used' before any test executes.
          # -onlyUsePackageVersionsFromResolvedFile: build the graph the lockfile pins, or fail —
          # see the freeze step in .github/actions/xcode-project.
          # 2>&1: xcodebuild reports its errors on stderr — without merging, the failure tail
          # below shows package resolution instead of the actual cause.
          # -test-timeouts-enabled: a single wedged test fails itself, by name, instead of
          # stalling the whole run behind it. No test here runs anywhere near 120s.
          # grep --line-buffered: without it the log streams a 4KB block at a time, so when a
          # run does stall the last visible line is minutes behind where it stopped.
          xcodebuild test \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlasses \
            -destination "platform=iOS Simulator,id=${{ steps.project.outputs.simulator-udid }}" \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath .spm-checkouts \
            -onlyUsePackageVersionsFromResolvedFile \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            SWIFT_EMIT_LOC_STRINGS=NO \
            2>&1 | tee xcodebuild.log | grep --line-buffered -E "Test Suite|Test Case.*(passed|failed)|error:|\*\* TEST" \
            || { tail -100 xcodebuild.log; exit 1; }

      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: provenance.txt
          retention-days: 90

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7

  # What went into the build, as a document (W06.4). The provenance record above says what the
  # machine was; this says what the software was — third-party packages, vendored binaries,
  # verified tooling and model weights, with a digest wherever one exists.
  #
  # Cheap Linux job, no Xcode: every input is a file already in the checkout, because an SBOM
  # that needs the network cannot be produced for an old commit, which is when anyone wants one.
  #
  # The determinism check is the point of running it twice. A manifest nobody can regenerate is a
  # manifest nobody can check, and a second run that differs means either an input moved or the
  # generator has a clock or a random number in it. Both are failures worth a red job.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The generator reads HEAD's committer date for the timestamp, and a shallow clone still
          # has that. fetch-depth is left at the default deliberately: nothing here walks history.
          fetch-depth: 1

      - name: Generate the SBOM
        run: ./Scripts/generate-sbom.sh --output sbom.cdx.json

      - name: Regenerate and diff
        run: |
          set -euo pipefail
          ./Scripts/generate-sbom.sh --output sbom-again.cdx.json
          if ! diff -u sbom.cdx.json sbom-again.cdx.json; then
            echo "::error::The SBOM is not reproducible — two runs of the generator over the same"
            echo "::error::commit produced different documents. Look for a wall-clock timestamp or"
            echo "::error::a random serial number; the generator must derive both from the commit."
            exit 1
          fi
          echo "Reproducible: two runs over ${{ github.sha }} produced identical documents."
          rm sbom-again.cdx.json

      - name: Summarise
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          bom = json.load(open("sbom.cdx.json"))
          components = bom["components"]
          counts = {}
          for component in components:
              counts[component["type"]] = counts.get(component["type"], 0) + 1
          hashed = sum(1 for c in components if c.get("hashes"))
          gaps = [c["name"] for c in components
                  if any(p["name"] == "openglasses:pin-gap" for p in c.get("properties", []))]
          print("### SBOM\n")
          print("`%s` — %d components\n" % (bom["serialNumber"], len(components)))
          for kind, count in sorted(counts.items()):
              print("- %s: %d" % (kind, count))
          print("\n%d of %d carry a digest.\n" % (hashed, len(components)))
          if gaps:
              print("Components fetched with no revision pin and no recorded digest:\n")
              for name in sorted(gaps):
                  print("- `%s`" % name)
          PY

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # Path filters in GitHub Actions are workflow-level, and this workflow's filter belongs to the
  # unit gate above — narrowing it to the security surface would stop that gate running on
  # everything else. So the security job's trigger is computed here instead: one cheap Linux job
  # that diffs the pull request against its merge base and says whether the surface moved.
  #
  # The workflow's existing `paths-ignore` is untouched. It has no negation patterns (`**.md` and
  # `docs/**`), so its semantics are exactly what they read as; nothing here depends on that
  # beyond leaving it alone.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      security: ${{ steps.filter.outputs.security }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did the security surface change?
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request — running the security regression suite unconditionally."
            echo "security=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          # Security-relevant surface: the network/containment policies, the pack and vision
          # admission paths, every native tool (the action surface), the compliance router, the
          # LLM egress point, and CI itself — a workflow change can disable the gate.
          pattern='^(OpenGlasses/Sources/Services/(Security|SkillPacks|Vision|NativeTools)/'
          pattern="$pattern"'|OpenGlasses/Sources/Services/(HIPAAComplianceService|LLMService)\.swift$'
          pattern="$pattern"'|\.github/(workflows|actions)/)'
          if printf '%s\n' "$changed" | grep -Eq "$pattern"; then
            echo "security=true" >> "$GITHUB_OUTPUT"
            echo "-> security surface touched; the regression suite will run."
          else
            echo "security=false" >> "$GITHUB_OUTPUT"
            echo "-> security surface untouched; skipping the regression suite."
          fi

  # A named, blocking gate for the controls W02-W05 and W08 rest on. The full suite above already
  # contains these classes, so on a PR that touches the security surface this is deliberately
  # redundant compute — bought for one property the full run cannot give: a required check whose
  # name says what it protects, so branch protection can require *this* rather than "all tests
  # passed", and a red one names the boundary that broke instead of a number.
  security-regression:
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Privacy-logging gate
        run: ./Scripts/check-privacy-logging.sh

      - name: Prepare the Xcode project
        id: project
        uses: ./.github/actions/xcode-project

      - name: Run the security regression suite
        timeout-minutes: 45
        run: |
          set -o pipefail
          xcodebuild test \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlasses \
            -destination "platform=iOS Simulator,id=${{ steps.project.outputs.simulator-udid }}" \
            -resultBundlePath SecurityResults.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath .spm-checkouts \
            -onlyUsePackageVersionsFromResolvedFile \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -only-testing:OpenGlassesTests/BoundedHTTPClientTests \
            -only-testing:OpenGlassesTests/SkillPackCatalogTests \
            -only-testing:OpenGlassesTests/SkillPackSideloadTests \
            -only-testing:OpenGlassesTests/BookFileExtractorTests \
            -only-testing:OpenGlassesTests/UntrustedNetworkFeaturePolicyTests \
            -only-testing:OpenGlassesTests/LocalServiceExposurePolicyTests \
            -only-testing:OpenGlassesTests/ComposedToolContainmentTests \
            -only-testing:OpenGlassesTests/OutboundFramePrivacyTests \
            -only-testing:OpenGlassesTests/PrivacyFilterScopeTests \
            -only-testing:OpenGlassesTests/MedicalComplianceTests \
            -only-testing:OpenGlassesTests/MedicalLLMRoutingPolicyTests \
            -only-testing:OpenGlassesTests/OperationJournalTests \
            -only-testing:OpenGlassesTests/SafetyGateTests \
            -only-testing:OpenGlassesTests/PrivacyCanaryTests \
            -only-testing:OpenGlassesTests/PrivacyLogTests \
            -only-testing:OpenGlassesTests/TelemetryOptOutGuardTests \
            SWIFT_EMIT_LOC_STRINGS=NO \
            2>&1 | tee security.log | grep --line-buffered -E "Test Suite|Test Case.*(passed|failed)|error:|\*\* TEST" \
            || { tail -100 security.log; exit 1; }

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SecurityResults
          path: SecurityResults.xcresult
          retention-days: 7
