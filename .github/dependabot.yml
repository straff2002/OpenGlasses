# Dependabot configuration (W06.2).
#
# Only one of this repository's two dependency ecosystems can be automated, and the reason is
# worth stating rather than leaving as an unexplained omission.
#
# GitHub Actions — automated below. Every `uses:` in .github/ is pinned to a commit SHA (W06.1),
# which is the safe pin and also the unreadable one: nobody notices a pinned action going stale,
# and a pinned action never picks up its own security fixes. Dependabot understands the
# `# vX.Y.Z` comment beside each SHA, bumps both together, and is the thing that makes SHA
# pinning sustainable instead of a slow rot.
#
# Swift (SwiftPM) — deliberately NOT automated. Dependabot's `swift` ecosystem reads
# `Package.swift` + `Package.resolved` from a directory. This repository has both at the root,
# but they are not what builds the app: the app is generated by XcodeGen from
# `project.base.yml`, and the lockfile both CI paths compile against is
# `ci_scripts/Package.resolved`. Dependabot has no XcodeGen support and would not touch either.
#
# The root pair is already measurably behind the authoritative one — it admits
# meta-wearables-dat-ios `from: "0.7.0"` and records 0.8.0, where `project.base.yml` pins 0.9.0
# exactly because that SDK breaks API on every minor bump. Pointing Dependabot at the root
# manifest would open confident-looking PRs that move a manifest nothing compiles, leave the
# real pins untouched, and widen that gap on a weekly schedule. A dependency PR that changes
# nothing the app links is worse than no dependency PR.
#
# The manual review path that replaces it is documented in docs/BUILDING.md ("Reviewing
# dependency updates"): edit `project.base.yml`, regenerate, re-resolve, run
# `./Scripts/update-package-resolved.sh`, and commit the lockfile with the spec change so the
# reviewed graph and the built graph are the same graph. Revisit this file if Dependabot ever
# learns XcodeGen, or if the root package becomes the authoritative manifest.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Pacific/Auckland
    # Five open PRs is more than this repository can review in a week; the cap makes Dependabot
    # queue rather than pile up, and a full queue is itself the signal that reviews have stalled.
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
    groups:
      # Minor and patch bumps of first-party GitHub actions are the common case and are reviewed
      # as one diff — five separate PRs to move five `actions/*` pins is five reviews of the same
      # decision. Majors stay ungrouped: those are the ones that change inputs and behaviour, and
      # each deserves its own read.
      actions-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
