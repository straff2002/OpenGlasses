targets:
  OpenGlassesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenGlassesTests
    dependencies:
      - target: OpenGlasses
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.openglasses.app.tests
        SWIFT_VERSION: 5.9
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenGlasses.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenGlasses"

schemes:
  OpenGlasses:
    test:
      targets:
        - OpenGlassesTests
