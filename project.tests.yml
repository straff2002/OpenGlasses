targets:
  OpenGlassesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenGlassesTests
        excludes:
          - "Fixtures/**"
      # The accessibility gate's pure timing rules (retry policy, frame-settle tracker) live in
      # the UI-test target but have no XCUITest dependency, so they are compiled here as well and
      # unit-tested by AuditTimingPolicyTests. A UI-test target has no fast suite of its own.
      - path: OpenGlassesUITests/AuditTimingPolicy.swift
      # The product-rename script's rules (Plan FY P1), compiled in so BrandNameGuardTests can run
      # them on fixtures and on the tree. Its entry point is a lazy global that a module never
      # reads, so compiling it here runs nothing.
      - path: Scripts/rename-to-avenkin.swift
      # Golden fixtures exported from the Python reference pipeline (Plan CK —
      # Scripts/export-fingerspelling-fixtures.py); loaded via Bundle(for:).
      - path: OpenGlassesTests/Fixtures
        buildPhase: resources
      # Shared FX1 public assignment/archive fixtures (no production keys or content).
      - path: Contracts/fixtures/manual-assignment-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/manual-fixture-keys.json
        buildPhase: resources
      - path: Contracts/fixtures/manual-vault-v1.zip
        buildPhase: resources
      - path: Contracts/fixtures/managed-job-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/managed-job-v1.ogjob
        buildPhase: resources
      - path: Contracts/fixtures/managed-job-fixture-keys.json
        buildPhase: resources
      - path: Contracts/fixtures/managed-job-receipt-v1.json
        buildPhase: resources
      # The format-2 job file, signed with a fictional key derived from a public label.
      - path: Contracts/fixtures/job-file-v2.ogjob
        buildPhase: resources
      - path: Contracts/fixtures/job-file-v2-needs.ogjob
        buildPhase: resources
      # The bulk-content contract: a publisher grant, a vault it signed, its assignment and receipts.
      - path: Contracts/fixtures/office-publisher-grant-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-bulk-vault-v1.zip
        buildPhase: resources
      - path: Contracts/fixtures/office-bulk-assignment-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-bulk-assignment-receipt-received-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-bulk-assignment-receipt-installed-v1.json
        buildPhase: resources
      # The job-update contract: three updates on one job and the phone's receipt for the first.
      - path: Contracts/fixtures/job-update-parts-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/job-update-schedule-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/job-update-note-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/job-update-receipt-v1.json
        buildPhase: resources
      # The report contract's golden report, record, manifest and receipts.
      - path: Contracts/fixtures/office-report-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-report-record-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-report-manifest-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-report-receipt-pending-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-report-receipt-record-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-report-receipt-full-v1.json
        buildPhase: resources
      # The check-in contract's golden exchange and removal (fictional keys from public labels).
      - path: Contracts/fixtures/office-check-in-binding-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-check-in-challenge-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-check-in-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-check-in-result-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-removal-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-removal-receipt-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/office-check-in-fixture-keys.json
        buildPhase: resources
      # The recorded-session contract: a golden timeline and transcript, the segments the transcript
      # gives, and the shared rules' cases (action-event validation, agreement, the index). Fictional.
      - path: Contracts/fixtures/recorded-session-timeline-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/recorded-session-transcript-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/walkthrough-segments-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/action-events-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/agreement-v1.json
        buildPhase: resources
      - path: Contracts/fixtures/cross-reference-v1.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openglasses.app.tests
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenGlasses.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenGlasses"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: OpenGlasses

  # The app's first UI-test target (Plan DF P4): the accessibility regression gate.
  #
  # It is a separate target rather than more cases in OpenGlassesTests because the thing being
  # asserted — traits, grouping, focus order, hit regions, contrast as rendered — exists only in
  # a running UI. A unit test cannot reach it: it has no app process to audit, and this app's
  # services fatal headless (`Wearables`).
  #
  # Kept out of the `OpenGlasses` scheme on purpose. That scheme is what CI runs per PR, and a
  # UI-test run boots a simulator and launches the app once per case — minutes, against seconds
  # for the unit suite. `OpenGlassesUITests` is its own scheme so each can be run alone.
  OpenGlassesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OpenGlassesUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openglasses.app.uitests
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: OpenGlasses
    dependencies:
      - target: OpenGlasses

schemes:
  OpenGlasses:
    test:
      config: Debug
      targets:
        - OpenGlassesTests
      commandLineArguments:
        "-ApplePersistenceIgnoreState": "YES"

  OpenGlassesUITests:
    build:
      targets:
        OpenGlasses: [run, test, profile, analyze, archive]
        OpenGlassesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenGlassesUITests
