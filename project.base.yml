name: OpenGlasses
settings:
  base:
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    # Personal signing (DEVELOPMENT_TEAM, personal entitlements/Info) lives in
    # project.local.yml — copy project.local.yml.example and fill in your team.
options:
  bundleIdPrefix: com.openglasses
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  # Sets LastUpgradeCheck (27.0 -> 2700). Keep in step with the project's Xcode
  # baseline so Xcode's "Update to recommended settings" validation stays quiet.
  xcodeVersion: "27.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
    - zh-Hant
    - ja
    - ko
    - cs
    - pl
    - pt-BR
    - pt-PT
    - es
    - es-MX
    - fr
    - fr-CA
    - de
    - it
    - nl
    - th
    - ar
    - hi
    - ru
    - sv
    - fi
    - uk
    - el
    - tr
    - da
    - nb
    - ro
    - hu
    - hr
    - sk
    - ms
    - vi
    - id
    - ca

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios.git
    # Pinned exact, not `from:`. For a 0.x package `from:` admits any later 0.y, and this SDK
    # breaks API on minor bumps: 0.9.0 replaced `addStream` with the consolidated `Camera`
    # capability (`addCamera`) and removed `CaptureError`; 0.8.0 removed the `Capability`
    # protocol; 0.7.0 removed `DeviceStateSession` outright. A published 0.10.0 would be
    # adopted on the next resolve and break the build with no change here.
    version: "0.9.0"
  HaishinKit:
    url: https://github.com/shogo4405/HaishinKit.swift.git
    from: "2.2.5"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    # Pinned to a revision, not a tag, and deliberately: the Gemma 4 VLM load failure
    # (`keyNotFound(…k_norm.weight, Gemma4RMSNormZeroShift)` — KV-shared layers must not
    # declare k_proj/v_proj) is fixed upstream in 09deb8c, and no released tag contains it —
    # the newest, 3.31.4, predates it. Go back to `version:` as soon as a tag ships that does.
    #
    # Why *this* revision and not upstream's tip: the next commit after it (14414441) retargets
    # MLXFoundationModels at the Xcode 27 beta 5 SDK (27A5237l), and MLXHuggingFace — which we
    # link for `#hubDownloader` — pulls that module in through a default-on package trait. On an
    # earlier 27.0 beta the retarget does not compile (`updateMetadata` takes
    # `[String: any Sendable & Codable & Equatable]` there, not `ConvertibleToGeneratedContent`).
    # So: on beta 5 or later, move to 14414441 or newer; before it, stay here.
    revision: d6614025fa1f6133e34c4fe0cea2815d672d8742
  swift-huggingface:
    # Same 0.x exposure as the DAT SDK, and it already drifted: the spec said `from: "0.1.0"` while
    # Package.resolved had walked to 0.9.0 — eight minor versions of a pre-1.0 package, adopted
    # silently. Pinned at the version actually in use.
    url: https://github.com/huggingface/swift-huggingface.git
    version: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: "1.0.0"
  SystemNotification:
    url: https://github.com/danielsaidi/SystemNotification.git
    from: "1.0.0"
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "120.0.0"
  # Vendored sherpa-onnx + onnxruntime iOS xcframeworks for the on-device Kokoro TTS
  # tier (Additional Capabilities #1). Local package; binaries under Vendor/SherpaOnnx/Frameworks.
  SherpaOnnx:
    path: Vendor/SherpaOnnx
  # Vendored MediaPipe Tasks Vision (Plan CK fingerspelling landmark pipeline). Local
  # package; binaries under Vendor/MediaPipeTasks/Frameworks are FETCHED, not committed —
  # run Scripts/fetch-mediapipe-frameworks.sh once after cloning (CI does it post-clone).
  MediaPipeTasks:
    path: Vendor/MediaPipeTasks
  # Vendored llama.cpp engine for the GGUF local-inference runtime (Plan DZ). Local package;
  # the binary under Vendor/LlamaCpp/Frameworks is BUILT, not committed — run
  # Scripts/fetch-llamacpp-framework.sh once after cloning (CI does it post-clone). The pin and
  # the digests are what's tracked: Vendor/LlamaCpp/{REVISION,SHA256SUMS,BUILD-INFO}.
  #
  # Linking it is not enabling it: nothing in the app reaches the engine unless
  # Config.ggufModelsEnabled is on, which it is not by default. The MLX path does not go through
  # this package at all.
  LlamaCpp:
    path: Vendor/LlamaCpp

targets:
  OpenGlasses:
    type: application
    platform: iOS
    sources:
      - path: OpenGlasses/Sources
        excludes:
          - "Resources/Vaults/**"
      - path: OpenGlasses/Sources/Resources/Vaults
        type: folder
      # Shared with widget/watch targets — defines LogoIcon + AccentColors
      - path: GlassesActivityWidget/AccentColors.swift
      # Shared with widget target — UserDefaults-backed listening state
      - path: GlassesActivityWidget/SharedAppState.swift
    entitlements:
      path: OpenGlasses/OpenGlasses.entitlements
      properties:
        com.apple.developer.homekit: true
        com.apple.developer.carplay-voice-based-conversation: true
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.security.application-groups:
          - group.com.openglasses.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openglasses.app
        MARKETING_VERSION: "2026.8"
        CURRENT_PROJECT_VERSION: "362"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: OpenGlasses/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # Meta DAT credentials. The Info.plist references these as $(...) so the committed
        # plist stays the single source of truth for every OTHER key — overriding
        # INFOPLIST_FILE to a personal copy is what caused ITMS-90683 (a snapshot went stale
        # and silently dropped newly added usage descriptions), and later left MetaAppID on
        # the placeholder, which stalls DAT registration below state 3 and means the camera
        # permission prompt never fires.
        # Real values belong in the gitignored project.local.yml — never here. These
        # placeholders are what the launch-time check in OpenGlassesApp looks for.
        MWDAT_META_APP_ID: YOUR_META_APP_ID
        MWDAT_CLIENT_TOKEN_HASH: YOUR_CLIENT_TOKEN_HASH
        INFOPLIST_KEY_CFBundleDisplayName: "OpenGlasses"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        # Compiles the real on-device sherpa-onnx inference paths — Kokoro TTS (Additional
        # Capabilities #1, `#if KOKORO_ENABLED`) and SenseVoice ASR (#8, `#if SHERPA_ONNX_ENABLED`).
        # The vendored sherpa-onnx binary (Vendor/SherpaOnnx) provides the C API for both.
        OTHER_SWIFT_FLAGS: "$(inherited) -D KOKORO_ENABLED -D SHERPA_ONNX_ENABLED"
        SKIP_INSTALL: "NO"
      configs:
        # MediaPipe's graph runtime lives in a separate per-SDK archive (SPM can't express
        # sim-vs-device linker flags — this is the podspec's user_target_xcconfig,
        # translated). The framework references its symbols, so every config must link it.
        #
        # NOTHING force-loads it any more (issue #304). Force-loading dragged in every object
        # file of the 410 MB device archive — 867 OpenFst `FstRegisterer` static initialisers
        # plus ~47,859 abseil symbols — and ran them pre-`main` on the main thread, where the
        # registry deadlocked on an `absl::Mutex` that never resolved. iOS killed the process
        # at the 20-second launch watchdog (`0x8BADF00D`): black screen, no Release build
        # would launch on device, side-loaded or via TestFlight. The same contention had
        # already been seen hanging the XCTest runner at bootstrap, which is why Debug never
        # force-loaded.
        #
        # Root cause is a duplicate abseil runtime, not force_load itself:
        # `MediaPipeTasksCommon.framework` carries its own abseil (2,046 symbols, incl. 26
        # `absl::Mutex::lock`) and the archive carries another ~47,859, so force-loading puts
        # two copies in one process and the registrars can bind to a different instance than
        # the one whose state was initialised. (Vendored sherpa-onnx is NOT involved — it has
        # zero `fst::`/`absl` symbols.)
        #
        # Cost of dropping it: plain archive linking dead-strips the calculator registrations,
        # so the MediaPipe graph paths (holistic landmarker → fingerspelling, Plan CK) do not
        # work in a Release build. That loses nothing that previously *worked* — Release never
        # launched on device, so those paths have never run in a shipping build. Restoring
        # them needs the duplicate-abseil fix, not this flag: see #304.
        Debug:
          "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Vendor/MediaPipeTasks/Frameworks/graph_libraries/libMediaPipeTasksCommon_device_graph.a"
          "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Vendor/MediaPipeTasks/Frameworks/graph_libraries/libMediaPipeTasksCommon_simulator_graph.a"
        Release:
          "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Vendor/MediaPipeTasks/Frameworks/graph_libraries/libMediaPipeTasksCommon_device_graph.a"
          "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Vendor/MediaPipeTasks/Frameworks/graph_libraries/libMediaPipeTasksCommon_simulator_graph.a"
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
      - package: meta-wearables-dat-ios
        product: MWDATDisplay
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: SystemNotification
        product: SystemNotification
      - package: WebRTC
        product: WebRTC
      - package: SherpaOnnx
        product: SherpaOnnxWrapper
      - package: MediaPipeTasks
        product: MediaPipeTasksShim
      - package: LlamaCpp
        product: LlamaCppWrapper
      - target: GlassesActivityWidget
      - target: OpenGlassesShareExtension

  GlassesActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GlassesActivityWidget
      - path: OpenGlasses/Sources/Models/GlassesActivityAttributes.swift
      # Shared with the main app — the widget stamps the deep-link trust token that the
      # app requires on any link that acts (capture, listen, quick action).
      - path: OpenGlasses/Sources/Shared/DeepLinkTrust.swift
    entitlements:
      path: GlassesActivityWidget/GlassesActivityWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.openglasses.app
    info:
      path: GlassesActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: "OpenGlasses"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openglasses.app.GlassesActivityWidget
        MARKETING_VERSION: "2026.8"
        CURRENT_PROJECT_VERSION: "362"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: "YES"
        CODE_SIGN_STYLE: Automatic

  # Share Extension (Teleprompter Phase 2 / PR B): accepts shared text, URLs, and text
  # files from the iOS share sheet and hands them to the app via the app-group inbox
  # (SharedTeleprompterInbox), which the main app drains into TeleprompterScriptStore.
  OpenGlassesShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenGlassesShareExtension
      # Shared with the main app — the app-group hand-off inbox.
      - path: OpenGlasses/Sources/Shared/SharedTeleprompterInbox.swift
    entitlements:
      path: OpenGlassesShareExtension/OpenGlassesShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.openglasses.app
    info:
      path: OpenGlassesShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "OpenGlasses Teleprompter"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openglasses.app.ShareExtension
        MARKETING_VERSION: "2026.8"
        CURRENT_PROJECT_VERSION: "362"
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: "YES"
        CODE_SIGN_STYLE: Automatic

schemes:
  OpenGlasses:
    build:
      targets:
        OpenGlasses: all
        GlassesActivityWidget: all
        OpenGlassesShareExtension: all
    run:
      config: Debug
      debugEnabled: true
      askForAppToLaunch: false
      # Launch the app, not the widget. Without an explicit executable, XcodeGen
      # made the first buildable target the runnable — GlassesActivityWidget sorts
      # before OpenGlasses — and launchAutomaticallySubstyle: 2 turned the run
      # action into a WidgetKit "show widget" launch via SpringBoard, which fails
      # on a locked device ("Failed to show Widget … device was not unlocked").
      executable: OpenGlasses
    archive:
      config: Release
